<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>申万行业分类 - A股股票池</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
  background: #f0f2f5;
  color: #1a1a2e;
  min-height: 100vh;
  padding: 24px 20px;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
}

/* ===== 顶部标题 ===== */
.header {
  text-align: center;
  margin-bottom: 24px;
}
.header h1 {
  font-size: 1.8rem;
  font-weight: 800;
  letter-spacing: 0.02em;
}
.header p {
  margin-top: 6px;
  color: #667085;
  font-size: 0.92rem;
}
.back-link {
  display: inline-block;
  margin-top: 12px;
  padding: 7px 16px;
  border: 1px solid #c7d7f0;
  border-radius: 999px;
  background: #fff;
  color: #2f72d6;
  font-size: 0.88rem;
  font-weight: 600;
  text-decoration: none;
  transition: box-shadow 0.2s ease, transform 0.2s ease;
}
.back-link:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(47, 114, 214, 0.12);
}

/* ===== 进度条区域 ===== */
.progress-section {
  background: #fff;
  border-radius: 16px;
  padding: 28px 32px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  margin-bottom: 24px;
}
.progress-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 16px;
}
.progress-title {
  font-size: 1.05rem;
  font-weight: 700;
}
.progress-stats {
  font-size: 0.95rem;
  color: #475467;
}
.progress-stats .selected-count {
  font-weight: 800;
  font-size: 1.2rem;
  color: #2f72d6;
}
.progress-stats .total-count {
  font-weight: 600;
  color: #98a2b3;
}

.progress-bar {
  width: 100%;
  height: 36px;
  background: #e9ecef;
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  position: relative;
  transition: box-shadow 0.2s ease;
}
.progress-bar:hover {
  box-shadow: 0 0 0 2px rgba(47,114,214,0.15);
}
.progress-segment {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.72rem;
  color: #fff;
  font-weight: 600;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: width 0.3s ease, opacity 0.2s ease;
  cursor: default;
  position: relative;
}
.progress-segment:hover {
  opacity: 0.85;
}
.progress-segment .seg-tooltip {
  display: none;
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  background: #1a1a2e;
  color: #fff;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 0.8rem;
  white-space: nowrap;
  z-index: 100;
  margin-bottom: 6px;
  font-weight: 400;
  text-shadow: none;
}
.progress-segment:hover .seg-tooltip {
  display: block;
}

.progress-legend {
  margin-top: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.82rem;
  color: #475467;
  cursor: pointer;
  padding: 4px 10px;
  border-radius: 999px;
  background: #f7f9fc;
  transition: background 0.2s ease;
}
.legend-item:hover {
  background: #eef2f7;
}
.legend-item.is-checked {
  background: #e8f0fe;
}
.legend-dot {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  flex-shrink: 0;
}

/* ===== 工具栏 ===== */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 12px;
}
.toolbar-left {
  display: flex;
  gap: 10px;
}
.btn {
  padding: 8px 18px;
  border: none;
  border-radius: 8px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}
.btn-select-all {
  background: #2f72d6;
  color: #fff;
}
.btn-select-all:hover { background: #1e5fb8; }
.btn-clear {
  background: #fff;
  color: #ef4444;
  border: 1px solid #fecaca;
}
.btn-clear:hover { background: #fef2f2; }
.toolbar-search {
  padding: 8px 14px;
  border: 1px solid #e4e7ec;
  border-radius: 8px;
  font-size: 0.88rem;
  width: 200px;
  outline: none;
  transition: border-color 0.2s ease;
}
.toolbar-search:focus {
  border-color: #2f72d6;
}

/* ===== 行业分组区域 ===== */
.industry-groups {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 16px;
}
.industry-group {
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  transition: box-shadow 0.2s ease;
}
.industry-group:hover {
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}
.group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid #f0f1f3;
}
.group-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1rem;
  font-weight: 700;
}
.group-color-bar {
  width: 4px;
  height: 20px;
  border-radius: 2px;
}
.group-count {
  font-size: 0.82rem;
  color: #98a2b3;
}
.group-select-btn {
  font-size: 0.8rem;
  color: #2f72d6;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 4px;
  transition: background 0.2s ease;
}
.group-select-btn:hover {
  background: #e8f0fe;
}

.industry-items {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.industry-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s ease;
}
.industry-item:hover {
  background: #f7f9fc;
}
.industry-item input[type="checkbox"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: var(--item-color, #2f72d6);
  flex-shrink: 0;
}
.industry-item .item-name {
  font-size: 0.92rem;
  flex: 1;
}
.industry-item .item-count {
  font-size: 0.82rem;
  color: #98a2b3;
  font-weight: 600;
}

@media (max-width: 760px) {
  .industry-groups {
    grid-template-columns: 1fr;
  }
  .toolbar-search {
    width: 100%;
  }
  .progress-section {
    padding: 20px 16px;
  }
}
</style>
</head>
<body>

// ===== 为每个一级行业分配颜色（HSL 色环均匀分布） =====
const groupColors = {};
const itemColors = {};
INDUSTRY_DATA.forEach((group, gi) => {
  const hue = Math.round((gi * 360 / INDUSTRY_DATA.length) % 360);
  const baseColor = `hsl(${hue}, 68%, 52%)`;
  groupColors[group.name] = baseColor;
  group.children.forEach((child, ci) => {
    // 同组内亮度微调
    const lightness = 48 + (ci % 3) * 8;
    itemColors[child.name] = `hsl(${hue}, 68%, ${lightness}%)`;
  });
});

// ===== 状态管理 =====
let checkedItems = loadSelection();

function loadSelection() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return new Set();
    const arr = JSON.parse(saved);
    return new Set(arr);
  } catch (e) {
    return new Set();
  }
}

function saveSelection() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...checkedItems]));
}

// ===== 获取已选的二级分类列表（按勾选顺序） =====
// 使用数组维护勾选顺序
let checkedOrder = [];
try {
  const saved = localStorage.getItem(STORAGE_KEY + "-order");
  checkedOrder = saved ? JSON.parse(saved) : [];
  // 过滤掉不在 checkedItems 中的
  checkedOrder = checkedOrder.filter(name => checkedItems.has(name));
  // 加入 checkedItems 中但不在 order 中的
  checkedItems.forEach(name => {
    if (!checkedOrder.includes(name)) checkedOrder.push(name);
  });
} catch (e) {
  checkedOrder = [...checkedItems];
}

function saveOrder() {
  localStorage.setItem(STORAGE_KEY + "-order", JSON.stringify(checkedOrder));
}

// ===== DOM 元素 =====
const groupsContainer = document.getElementById("industry-groups");
const progressBar = document.getElementById("progress-bar");
const progressLegend = document.getElementById("progress-legend");
const selectedCountEl = document.getElementById("selected-count");
const selectedPercentEl = document.getElementById("selected-percent");
const totalCountEl = document.getElementById("total-count");
totalCountEl.textContent = TOTAL_STOCKS;

// ===== 渲染行业分组 =====
function renderGroups() {
  groupsContainer.innerHTML = "";
  const searchTerm = document.getElementById("search-input").value.trim().toLowerCase();

  INDUSTRY_DATA.forEach(group => {
    let children = group.children;
    if (searchTerm) {
      const matchGroup = group.name.toLowerCase().includes(searchTerm);
      children = children.filter(c =>
        c.name.toLowerCase().includes(searchTerm) || matchGroup
      );
      if (children.length === 0) return;
    }

    const groupEl = document.createElement("div");
    groupEl.className = "industry-group";

    const groupColor = groupColors[group.name];

    // 分组标题
    const header = document.createElement("div");
    header.className = "group-header";
    header.innerHTML = `
      <div class="group-title">
        <span class="group-color-bar" style="background:${groupColor}"></span>
        <span>${group.name}</span>
        <span class="group-count">（${group.count} 只）</span>
      </div>
      <button class="group-select-btn" data-group="${group.name}">全选</button>
    `;
    groupEl.appendChild(header);

    // 二级分类列表
    const itemsEl = document.createElement("div");
    itemsEl.className = "industry-items";

    children.forEach(child => {
      const itemEl = document.createElement("label");
      itemEl.className = "industry-item";
      itemEl.style.setProperty("--item-color", itemColors[child.name]);
      const isChecked = checkedItems.has(child.name);
      itemEl.innerHTML = `
        <input type="checkbox" data-name="${child.name}" data-count="${child.count}" ${isChecked ? "checked" : ""} />
        <span class="item-name">${child.name}</span>
        <span class="item-count">${child.count} 只</span>
      `;
      itemsEl.appendChild(itemEl);
    });

    groupEl.appendChild(itemsEl);
    groupsContainer.appendChild(groupEl);
  });

  // 绑定事件
  groupsContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", handleToggle);
  });
  groupsContainer.querySelectorAll(".group-select-btn").forEach(btn => {
    btn.addEventListener("click", handleGroupSelect);
  });
}

// ===== 渲染进度条 =====
function renderProgress() {
  let selectedTotal = 0;
  const segments = [];

  // 按 checkedOrder 顺序构建色段
  checkedOrder.forEach(name => {
    if (!checkedItems.has(name)) return;
    // 查找数量
    let count = 0;
    for (const group of INDUSTRY_DATA) {
      for (const child of group.children) {
        if (child.name === name) { count = child.count; break; }
      }
      if (count) break;
    }
    if (count === 0) return;
    selectedTotal += count;
    segments.push({ name, count, color: itemColors[name] || "#999" });
  });

  // 进度条
  progressBar.innerHTML = "";
  segments.forEach(seg => {
    const widthPct = (seg.count / TOTAL_STOCKS * 100).toFixed(2);
    const segEl = document.createElement("div");
    segEl.className = "progress-segment";
    segEl.style.width = widthPct + "%";
    segEl.style.background = seg.color;
    // 只有宽度足够时才显示文字
    if (parseFloat(widthPct) > 3) {
      segEl.textContent = seg.count;
    }
    segEl.title = `${seg.name}（${seg.count} 只）`;
    progressBar.appendChild(segEl);
  });

  // 统计数字
  selectedCountEl.textContent = selectedTotal;
  selectedPercentEl.textContent = (selectedTotal / TOTAL_STOCKS * 100).toFixed(1) + "%";

  // 图例
  renderLegend(segments);
}

// ===== 渲染图例 =====
function renderLegend(segments) {
  progressLegend.innerHTML = "";
  if (segments.length === 0) return;

  segments.forEach(seg => {
    const item = document.createElement("span");
    item.className = "legend-item is-checked";
    item.innerHTML = `
      <span class="legend-dot" style="background:${seg.color}"></span>
      ${seg.name}（${seg.count}）
    `;
    item.addEventListener("click", () => {
      // 点击图例取消勾选
      toggleItem(seg.name);
    });
    progressLegend.appendChild(item);
  });
}

// ===== 交互处理 =====
function handleToggle(e) {
  const name = e.target.dataset.name;
  toggleItem(name);
}

function toggleItem(name) {
  if (checkedItems.has(name)) {
    checkedItems.delete(name);
    checkedOrder = checkedOrder.filter(n => n !== name);
  } else {
    checkedItems.add(name);
    checkedOrder.push(name);
  }
  saveSelection();
  saveOrder();
  // 更新复选框 UI
  const cb = groupsContainer.querySelector(`input[data-name="${name}"]`);
  if (cb) cb.checked = checkedItems.has(name);
  renderProgress();
}

function handleGroupSelect(e) {
  const groupName = e.target.dataset.group;
  const group = INDUSTRY_DATA.find(g => g.name === groupName);
  if (!group) return;

  // 判断是否全部已选
  const allChecked = group.children.every(c => checkedItems.has(c.name));
  if (allChecked) {
    // 取消全选
    group.children.forEach(c => {
      checkedItems.delete(c.name);
      checkedOrder = checkedOrder.filter(n => n !== c.name);
    });
    e.target.textContent = "全选";
  } else {
    // 全选
    group.children.forEach(c => {
      if (!checkedItems.has(c.name)) {
        checkedItems.add(c.name);
        checkedOrder.push(c.name);
      }
    });
    e.target.textContent = "取消";
  }
  saveSelection();
  saveOrder();
  renderGroups();
  renderProgress();
}

// 全选
document.getElementById("btn-select-all").addEventListener("click", () => {
  INDUSTRY_DATA.forEach(group => {
    group.children.forEach(c => {
      if (!checkedItems.has(c.name)) {
        checkedItems.add(c.name);
        checkedOrder.push(c.name);
      }
    });
  });
  saveSelection();
  saveOrder();
  renderGroups();
  renderProgress();
});

// 清空
document.getElementById("btn-clear").addEventListener("click", () => {
  checkedItems.clear();
  checkedOrder = [];
  saveSelection();
  saveOrder();
  renderGroups();
  renderProgress();
});

// 搜索
document.getElementById("search-input").addEventListener("input", renderGroups);

// ===== 初始化 =====
renderGroups();
renderProgress();
</script>
</body>
</html>
